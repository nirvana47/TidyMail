# ============================================================
# TidyMail — Application properties
# Most values are resolved from environment variables or .env
# via spring-dotenv. This file provides fallbacks and structural
# property names only.
# ============================================================

# Application
spring.application.name=TidyMail
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Logging
logging.level.root=INFO
logging.level.com.tidymail=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Thymeleaf templates
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Static resources
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/static/**

# JPA / Hibernate
# DDL writes are managed exclusively via Flyway migrations.
# Hibernate only validates that the entity model matches the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Hibernate 6's PostgreSQLDialect defaults @Lob byte[] to the legacy
# pg_largeobject (OID / lo_create / lo_import) mechanism by default.  Our
# Flyway DDL declares encrypted_* columns as plain Postgres BYTEA, so running
# ddl-auto=validate (or, worse, ddl-auto=update) against a real DB would throw
# "wrong column type encountered … found [bytea], but expecting [oid]" — this
# is a SchemaValidator mismatch in Hibernate 6.6.x.  The three properties
# below combine to force a plain BYTEA JDBC path on Postgres while remaining
# a no-op / harmless on H2 pg-mode:
#
#   1. `dialect` explicitly = PostgreSQLDialect (works fine even when the same
#      properties file is used against H2 — Hibernate 6 auto-selects H2Dialect
#      for H2 URLs and ignores an explicitly-set PostgreSQLDialect because the
#      JDBC metadata wins the dialect-resolution race).  Actually no —
#      explicit dialect overrides URL auto-detection universally and would
#      break H2 tests.  So we leave dialect as AUTO-SELECTED here.
#   2. `jdbc.lob.non_contextual_creation=true` — disable the OID / large-object
#      linkage on Postgres, use plain setBinaryStream/getBytes calls instead.
#   3. `type.preferred_long_length_lob_code=LONGVARBINARY` — tells Hibernate's
#      SchemaValidator to resolve LONGVARBINARY for @Lob byte[] columns rather
#      than falling back to the dialect default BLOB (which PostgreSQLDialect
#      maps to OID in its schema-type descriptor).  LONGVARBINARY resolves to
#      BYTEA in Postgres and to BINARY LARGE OBJECT / CLOB in H2, matching
#      Flyway DDL on both dialects.
#
# Together with the Hibernate 6 global behavior, the SchemaValidator now
# reports: on Postgres, expected LONGVARBINARY → BYTEA matches the column's
# actual type; on H2, expected LONGVARBINARY → BINARY LARGE OBJECT matches
# Flyway's H2 override BINARY LARGE OBJECT declaration.  No more OID vs BYTEA
# mismatches on real Postgres docker-compose stacks, no regression on H2
# integration tests.
spring.jpa.properties.hibernate.type.preferred_long_length_lob_code=LONGVARBINARY
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Hikari JDBC Connection Pool
spring.datasource.hikari.maximum-pool-size=${HIKARI_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# PostgreSQL Datasource
# Defaults point at local Docker Postgres (see docker-compose.yml).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tidymail}
spring.datasource.username=${DATABASE_USER:tidymail}
spring.datasource.password=${DATABASE_PASSWORD:tidymaildev}
spring.datasource.driver-class-name=org.postgresql.Driver

# Simplified single-account dashboard; legacy routes and execution stay disabled.
app.mvp.enabled=${TIDYMAIL_MVP_ENABLED:true}

# Flyway owns the schema. Keep migrations enabled by default so a local restart
# cannot run new entity code against yesterday's database schema.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Session
server.servlet.session.timeout=${SERVER_SERVLET_SESSION_TIMEOUT:86400s}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# Spring Security — OAuth2 client registration
# IMPORTANT: We intentionally do NOT declare spring.security.oauth2.client.*
# properties here with empty defaults, because Spring Boot validates every
# declared registration and rejects empty `client-id` with a hard startup
# failure (see PITFALLS.md §J2).  Instead Phase 2's `SecurityConfig` will
# conditionally build ClientRegistration beans only when the corresponding
# env vars (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, MICROSOFT_CLIENT_ID,
# MICROSOFT_CLIENT_SECRET, MICROSOFT_TENANT_ID) are populated via .env / OS.

# Server error handling
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Actuator
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info,metrics}
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# App-level flags (mirrored from .env for reference)
app.privacy.metadata-format-enforced=${PRIVACY_METADATA_FORMAT_ENFORCED:true}
app.safety.delete-confirm-threshold=${SAFETY_DELETE_CONFIRM_THRESHOLD:100}
app.safety.undo-window-seconds=${SAFETY_UNDO_WINDOW_SECONDS:600}
app.oauth.refresh-expiry-skew-seconds=${OAUTH_REFRESH_EXPIRY_SKEW_SECONDS:60}
app.sync.initial-page-size=${SYNC_INITIAL_PAGE_SIZE:200}
app.sync.max-messages-per-account=${SYNC_MAX_MESSAGES_PER_ACCOUNT:0}
app.sync.gmail-backfill-page-size=${SYNC_GMAIL_BACKFILL_PAGE_SIZE:500}
app.sync.gmail-repair-limit=${SYNC_GMAIL_REPAIR_LIMIT:100}
app.sync.gmail-freshness-reserved-capacity=${SYNC_GMAIL_FRESHNESS_RESERVED_CAPACITY:1}
app.sync.freshness-cycle-ms=${SYNC_FRESHNESS_CYCLE_MS:300000}
app.sync.startup-delay-ms=${SYNC_STARTUP_DELAY_MS:5000}
app.sync.freshness-executor-threads=${SYNC_FRESHNESS_EXECUTOR_THREADS:2}
app.sync.freshness-executor-queue-capacity=${SYNC_FRESHNESS_EXECUTOR_QUEUE_CAPACITY:100}
app.sync.backfill-executor-threads=${SYNC_BACKFILL_EXECUTOR_THREADS:2}
app.sync.backfill-executor-queue-capacity=${SYNC_BACKFILL_EXECUTOR_QUEUE_CAPACITY:100}
app.sync.lane-lease-seconds=${SYNC_LANE_LEASE_SECONDS:60}
app.sync.sender-stats-interval-ms=${SYNC_SENDER_STATS_INTERVAL_MS:1800000}
app.sync.gmail-api-concurrency=${SYNC_GMAIL_API_CONCURRENCY:5}
app.sync.gmail-api-batch-delay-ms=${SYNC_GMAIL_API_BATCH_DELAY_MS:100}
app.sync.gmail-metadata-batch-delay-ms=${SYNC_GMAIL_METADATA_BATCH_DELAY_MS:1000}

# Provider-neutral unsubscribe transport. These bounds are validated at startup.
app.unsubscribe.transport.dns-timeout=2s
app.unsubscribe.transport.connect-timeout=3s
app.unsubscribe.transport.tls-handshake-timeout=3s
app.unsubscribe.transport.response-header-timeout=5s
app.unsubscribe.transport.total-timeout=10s
app.unsubscribe.transport.max-dns-answers=8
app.unsubscribe.transport.max-response-bytes=8192
app.unsubscribe.transport.redirect-hops=0
app.unsubscribe.transport.automatic-retries=0

# Optional, user-started Jev classification; never sends bodies or attachments.
app.classification.api-key=${OPENROUTER_API_KEY:}
# Never enable HTTP request-body tracing on the classification client.
logging.level.org.springframework.web.client=OFF
