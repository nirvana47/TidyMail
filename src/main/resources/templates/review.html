<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TidyMail - Action history</title>
    <link rel="stylesheet" th:href="@{/static/css/workspace.css}">
</head>
<body>
<a class="skip-link" href="#workspace-main">Skip to workspace content</a>
<div th:replace="~{fragments/workspace-nav :: nav(${workspace})}"></div>
<div class="workspace-shell">
      <div th:replace="~{fragments/workspace-rail :: rail(${workspace})}"></div>
    <main id="workspace-main">
        <header class="page-header">
            <div class="page-title-stack">
                <h1>Action history</h1>
            </div>
        </header>

        <div th:replace="~{fragments/review-history-frag :: history(${history})}"></div>

        <p class="privacy-note">Only approved message metadata is indexed. Bodies and attachments are never stored. Provider identifiers, destinations, and credentials are never rendered.</p>
    </main>
</div>
</body>
</html>
