<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
:root {
  --tmux-background: #f4f6fb;
  --tmux-foreground: #111827;
  --tmux-card: #ffffff;
  --tmux-card-foreground: #111827;
  --tmux-popover: #ffffff;
  --tmux-popover-foreground: #111827;
  --tmux-primary: #3f5cff;
  --tmux-primary-foreground: #ffffff;
  --tmux-muted: #eef2ff;
  --tmux-muted-foreground: #5b6478;
  --tmux-border: #d9e0ee;
  --tmux-input: #d9e0ee;
  --tmux-ring: #3f5cff;
  --tmux-radius-sm: 6px;
  --tmux-radius-md: 10px;
  --tmux-radius-lg: 16px;

  --tmux-surface-2: #f8faff;
  --tmux-surface-3: #e8eefc;
  --tmux-text-soft: #6b7280;
  --tmux-text-strong: #0f172a;
  --tmux-success: #1f9d68;
  --tmux-success-soft: #e8fbf3;
  --tmux-warning: #b7791f;
  --tmux-warning-soft: #fff6df;
  --tmux-danger: #d14343;
  --tmux-danger-soft: #fff0f0;
  --tmux-info: #2f6ce5;
  --tmux-info-soft: #ebf2ff;

  --tmux-shadow-1: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.04);
  --tmux-shadow-2: 0 18px 48px rgba(15, 23, 42, 0.10);

  --font-sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "SFMono-Regular", ui-monospace, Menlo, monospace;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  font-family: var(--font-sans);
  background: var(--tmux-background);
  color: var(--tmux-foreground);
}

body {
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--tmux-background);
    --color-foreground: var(--tmux-foreground);
    --color-card: var(--tmux-card);
    --color-card-foreground: var(--tmux-card-foreground);
    --color-popover: var(--tmux-popover);
    --color-popover-foreground: var(--tmux-popover-foreground);
    --color-primary: var(--tmux-primary);
    --color-primary-foreground: var(--tmux-primary-foreground);
    --color-muted: var(--tmux-muted);
    --color-muted-foreground: var(--tmux-muted-foreground);
    --color-border: var(--tmux-border);
    --color-input: var(--tmux-input);
    --color-ring: var(--tmux-ring);
    --radius-sm: var(--tmux-radius-sm);
    --radius-md: var(--tmux-radius-md);
    --radius-lg: var(--tmux-radius-lg);
  }
  @layer base {
    body { background: var(--tmux-background); color: var(--tmux-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--tmux-background); }
      .text-background { color: var(--tmux-background); }
      .border-background { border-color: var(--tmux-background); }
      .ring-background { --tw-ring-color: var(--tmux-background); }
      .bg-foreground { background-color: var(--tmux-foreground); }
      .text-foreground { color: var(--tmux-foreground); }
      .border-foreground { border-color: var(--tmux-foreground); }
      .ring-foreground { --tw-ring-color: var(--tmux-foreground); }
      .bg-card { background-color: var(--tmux-card); }
      .text-card { color: var(--tmux-card); }
      .border-card { border-color: var(--tmux-card); }
      .ring-card { --tw-ring-color: var(--tmux-card); }
      .bg-card-foreground { background-color: var(--tmux-card-foreground); }
      .text-card-foreground { color: var(--tmux-card-foreground); }
      .border-card-foreground { border-color: var(--tmux-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--tmux-card-foreground); }
      .bg-popover { background-color: var(--tmux-popover); }
      .text-popover { color: var(--tmux-popover); }
      .border-popover { border-color: var(--tmux-popover); }
      .ring-popover { --tw-ring-color: var(--tmux-popover); }
      .bg-popover-foreground { background-color: var(--tmux-popover-foreground); }
      .text-popover-foreground { color: var(--tmux-popover-foreground); }
      .border-popover-foreground { border-color: var(--tmux-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--tmux-popover-foreground); }
      .bg-primary { background-color: var(--tmux-primary); }
      .text-primary { color: var(--tmux-primary); }
      .border-primary { border-color: var(--tmux-primary); }
      .ring-primary { --tw-ring-color: var(--tmux-primary); }
      .bg-primary-foreground { background-color: var(--tmux-primary-foreground); }
      .text-primary-foreground { color: var(--tmux-primary-foreground); }
      .border-primary-foreground { border-color: var(--tmux-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--tmux-primary-foreground); }
      .bg-muted { background-color: var(--tmux-muted); }
      .text-muted { color: var(--tmux-muted); }
      .border-muted { border-color: var(--tmux-muted); }
      .ring-muted { --tw-ring-color: var(--tmux-muted); }
      .bg-muted-foreground { background-color: var(--tmux-muted-foreground); }
      .text-muted-foreground { color: var(--tmux-muted-foreground); }
      .border-muted-foreground { border-color: var(--tmux-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--tmux-muted-foreground); }
      .bg-border { background-color: var(--tmux-border); }
      .text-border { color: var(--tmux-border); }
      .border-border { border-color: var(--tmux-border); }
      .ring-border { --tw-ring-color: var(--tmux-border); }
      .bg-input { background-color: var(--tmux-input); }
      .text-input { color: var(--tmux-input); }
      .border-input { border-color: var(--tmux-input); }
      .ring-input { --tw-ring-color: var(--tmux-input); }
      .bg-ring { background-color: var(--tmux-ring); }
      .text-ring { color: var(--tmux-ring); }
      .border-ring { border-color: var(--tmux-ring); }
      .ring-ring { --tw-ring-color: var(--tmux-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
